version: '3.8'

networks:
  nexus-net:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  postgres_intake_data:
  postgres_ai_data:

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-ai-fraud:
    image: pgvector/pgvector:pg16
    container_name: nexus-db-ai
    environment:
      POSTGRES_DB: ai_fraud_db
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d ai_fraud_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: ../
      dockerfile: backend/api-gateway/Dockerfile
    container_name: nexus-api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLAIM_INTAKE_URL: http://claim-intake-service:8081
      AI_FRAUD_TRIAGE_URL: http://ai-fraud-triage-service:8083
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-net

  claim-intake-service:
    build:
      context: ../
      dockerfile: backend/claim-intake-service/Dockerfile
    container_name: nexus-claim-intake-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexus-net

  claims-orchestrator-service:
    build:
      context: ../
      dockerfile: backend/claims-orchestrator-service/Dockerfile
    container_name: nexus-claims-orchestrator-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-net

  ai-fraud-triage-service:
    build:
      context: ../
      dockerfile: backend/ai-fraud-triage-service/Dockerfile
    container_name: nexus-ai-fraud-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:mock-key}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-net

  billing-payment-service:
    build:
      context: ../
      dockerfile: backend/billing-payment-service/Dockerfile
    container_name: nexus-billing-payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexus-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - nexus-net
